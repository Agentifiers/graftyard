name: CI

# Push to main only: no pull_request trigger, so a fork's pull request never runs on the self-hosted runner.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  design:
    name: Design checks
    runs-on: [self-hosted, srv]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_design.py
      - run: python3 scripts/check_names.py
      - run: python3 scripts/check_links.py

  runners-js:
    name: graft-runners' Sandbox start (node --test)
    runs-on: [self-hosted, srv]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'workers/runners/tests/*.test.mjs'
      - run: node --test 'workers/site/tests/*.test.mjs'

  web:
    name: Web format, typecheck, build
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  rust-lint:
    name: Rust fmt, clippy
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      # A restore normally takes under a minute; one hung for 16. Past 3 minutes, build cold instead.
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: wasm32 clippy, site and edge, with and without test-faults, graft-front, and graft-runners
        run: |
          for crate in workers/site workers/edge; do
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown -- -D warnings)
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown --features test-faults -- -D warnings)
          done
          (cd workers/front && cargo clippy --target wasm32-unknown-unknown -- -D warnings)
          (cd workers/runners && cargo clippy --target wasm32-unknown-unknown -- -D warnings)

  edgeboot:
    # The edge's own wasm, served in local workerd with no bindings, answers without a trap on the cold-guess path
    # (tests/edgeboot/run.sh). Native tests and clippy never run the wasm: mt16's edge (c3952949) overflowed wasm's 1 MiB
    # stack on every request and passed every other check.
    name: Edge wasm boot (workerd)
    runs-on: [self-hosted, srv]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          key: edgeboot
      - uses: taiki-e/install-action@v2
        with:
          # Not in install-action's own list: it falls back to cargo-binstall. Pinned to the version the orbs build with.
          tool: worker-build@0.8.7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tests/m0
      - run: bash tests/edgeboot/run.sh
      - run: PRODUCT=1 bash tests/edgeboot/run.sh

  rust-test:
    name: Rust tests (${{ matrix.shard }}/4)
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Line tables keep file and line in panics while cutting the debug info the 86 test binaries link.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 3
        continue-on-error: true
        with:
          key: test
          # The shards build the same thing, so one upload is enough.
          save-if: ${{ matrix.shard == 1 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # Each shard builds every test binary from the shared cache and runs a quarter of the tests; nextest skips
      # doc tests, so shard 1 runs them.
      - run: cargo nextest run --workspace --no-fail-fast --partition hash:${{ matrix.shard }}/4
      - if: matrix.shard == 1
        run: cargo test --workspace --doc

  go:
    name: Go tests
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    strategy:
      matrix:
        dir: [tests/m0/porcupine, containers/git/server, containers/ssh/server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # tests/fanout/raw is 465 MB of measurement logs that only the design checks read.
          sparse-checkout: |
            /*
            !/tests/fanout/raw/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - run: go test ./...
        working-directory: ${{ matrix.dir }}
