name: CI

# Push to main only: no pull_request trigger, so a fork's pull request never runs on the self-hosted runner.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  design:
    name: Design checks
    runs-on: [self-hosted, srv]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_design.py
      - run: python3 scripts/check_names.py
      - run: python3 scripts/check_links.py

  runners-js:
    name: graft-runners' Sandbox start (node --test)
    runs-on: [self-hosted, srv]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test 'workers/runners/tests/*.test.mjs'
      - run: node --test 'workers/site/tests/*.test.mjs'

  web:
    name: Web format, typecheck, build
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  rust-lint:
    name: Rust fmt, clippy
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: wasm32 clippy, site and edge, with and without test-faults, graft-front, and graft-runners
        run: |
          for crate in workers/site workers/edge; do
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown -- -D warnings)
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown --features test-faults -- -D warnings)
          done
          (cd workers/front && cargo clippy --target wasm32-unknown-unknown -- -D warnings)
          (cd workers/runners && cargo clippy --target wasm32-unknown-unknown -- -D warnings)

  rust-test:
    name: Rust tests
    runs-on: [self-hosted, srv]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest runs every test binary in parallel; it skips doc tests, so they run separately.
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo test --workspace --doc

  go:
    name: Go tests
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    strategy:
      matrix:
        dir: [tests/m0/porcupine, containers/git/server, containers/ssh/server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - run: go test ./...
        working-directory: ${{ matrix.dir }}
