name: CI

on:
  push:
    branches: [main, ci-srv]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  design:
    name: Design checks
    runs-on: [self-hosted, srv]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/check_design.py
      - run: python3 scripts/check_names.py
      - run: python3 scripts/check_links.py

  rust:
    name: Rust fmt, clippy, tests
    runs-on: [self-hosted, srv]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Runner tools
        run: |
          for t in rustup cargo rustc sccache go python3; do printf '%-8s ' "$t"; command -v "$t" >/dev/null && "$t" --version 2>&1 | head -1 || echo missing; done
          nproc; free -g | sed -n 2p
          grep -h remote_cache /etc/bazel.bazelrc 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: wasm32 clippy, site and edge, with and without test-faults
        run: |
          for crate in workers/site workers/edge; do
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown -- -D warnings)
            (cd "$crate" && cargo clippy --target wasm32-unknown-unknown --features test-faults -- -D warnings)
          done
      - run: cargo test --workspace

  go:
    name: Go tests
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    strategy:
      matrix:
        dir: [tests/m0/porcupine, containers/git/server]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache: false
      - run: go test ./...
        working-directory: ${{ matrix.dir }}
