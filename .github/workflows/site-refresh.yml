name: Site refresh

# Every day: fetch GitHub's last 90 days from The Missing GitHub Status Page, rebuild the site and deploy it
# to graftyard.com. A failed fetch stops before the build, so the live site keeps the previous day's figures.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-refresh
  cancel-in-progress: false

jobs:
  deploy:
    name: Refresh GitHub status and deploy graftyard.com
    runs-on: [self-hosted, srv]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # fetches the status data, builds, deploys (package.json "deploy")
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Figures now live
        run: jq -c '{asOf, uptime, incidents, daysWithIncident}' src/data/github-status.json
