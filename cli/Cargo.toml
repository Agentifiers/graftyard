[package]
name = "graftyard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "graftyard"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
graftyard-identity = { path = "../crates/identity" }
# `lifeboat bundle` reads export-state with the feed token, signed as the puller signs it.
graftyard-lifeboat = { path = "../lifeboat" }
graftyard-ops = { path = "../workers/ops" }
graftyard-raft = { path = "../crates/raft" }
graftyard-release = { path = "../crates/release" }
graftyard-types.workspace = true
# The first-party Apps' RS256 keys (`graftyard apps init`), drawn from the OS source; the CLI never builds for wasm.
# `sha2` signs the App JWT `runners init` checks the hosted-runners key with.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "getrandom", "sha2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
toml = "1"
ureq = { version = "2.12", features = ["json"] }
