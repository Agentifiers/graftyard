[package]
name = "graftyard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "graftyard"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.3"
graftyard-identity = { path = "../crates/identity" }
graftyard-raft = { path = "../crates/raft" }
graftyard-release = { path = "../crates/release" }
graftyard-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
toml = "1"
ureq = { version = "2.12", features = ["json"] }
