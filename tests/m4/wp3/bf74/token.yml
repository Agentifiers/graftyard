name: bf74-token
# BF-74 on graft-m4a (`tests/m4/wp3/bf74/row.sh token`): one dispatched job granted `id-token: write` writes one ID
# token for audience `bf74` to BF74_TOKEN_OUT on the runner's host (the orb, which `token.mjs` starts the runner on),
# for `rp.py` to verify. The token is never printed: the job prints only its length and its `iss`.
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  token:
    runs-on: [self-hosted, linux]
    steps:
      - run: |
          umask 077
          curl -sf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=bf74" |
            python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin)["value"])' >"$BF74_TOKEN_OUT"
          python3 -c '
          import base64, json, sys
          t = open(sys.argv[1]).read().split(".")
          c = json.loads(base64.urlsafe_b64decode(t[1] + "=" * (-len(t[1]) % 4)))
          print("token written,", len(".".join(t)), "bytes, iss", c["iss"])' "$BF74_TOKEN_OUT"
