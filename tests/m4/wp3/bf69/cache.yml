# BF-69 (build/BUILD-PLAN.md, M4-WP3): two jobs, one per actions/cache major (v4 on node20, v5 on node24). Each reads
# its case from `bf69.env` at the run's commit (Graftyard's dispatch takes no `inputs`, so the driver commits the case):
# KEY, RESTORE (comma-separated restore keys, or empty), SEED (1: write MIB MiB of random bytes when nothing restored, so
# the post step saves them) and MIB. A pull request's run reads the same file from its merge commit. Each job prints
# one `BF69` line the driver parses: what it saw in ACTIONS_CACHE_URL, then `restored sha256=… matched=…`, `made
# sha256=…`, or `miss`.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, rel]
jobs:
  v4:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - id: in
        run: |
          . ./bf69.env
          echo "key=$KEY-v4" >>"$GITHUB_OUTPUT"
          echo "restore=$(echo "$RESTORE" | tr ',' '\n' | sed '/^$/d; s/$/-v4/' | paste -sd, -)" >>"$GITHUB_OUTPUT"
          echo "BF69 v4 ref=$GITHUB_REF cache_url=$([ -n "$ACTIONS_CACHE_URL" ] && echo set || echo unset)"
      - id: c
        uses: actions/cache@v4
        with:
          path: bf69-data
          key: ${{ steps.in.outputs.key }}
          restore-keys: ${{ steps.in.outputs.restore }}
      - run: |
          . ./bf69.env
          if [ -f bf69-data/blob ]; then echo "BF69 v4 restored sha256=$(sha256sum bf69-data/blob | cut -d' ' -f1) hit=${{ steps.c.outputs.cache-hit }} matched=${{ steps.c.outputs.cache-matched-key }}"
          elif [ "$SEED" = 1 ]; then mkdir -p bf69-data && head -c $((MIB * 1048576)) /dev/urandom >bf69-data/blob
            echo "BF69 v4 made sha256=$(sha256sum bf69-data/blob | cut -d' ' -f1)"
          else echo "BF69 v4 miss"; fi
  v5:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - id: in
        run: |
          . ./bf69.env
          echo "key=$KEY-v5" >>"$GITHUB_OUTPUT"
          echo "restore=$(echo "$RESTORE" | tr ',' '\n' | sed '/^$/d; s/$/-v5/' | paste -sd, -)" >>"$GITHUB_OUTPUT"
          echo "BF69 v5 ref=$GITHUB_REF cache_url=$([ -n "$ACTIONS_CACHE_URL" ] && echo set || echo unset)"
      - id: c
        uses: actions/cache@v5
        with:
          path: bf69-data
          key: ${{ steps.in.outputs.key }}
          restore-keys: ${{ steps.in.outputs.restore }}
      - run: |
          . ./bf69.env
          if [ -f bf69-data/blob ]; then echo "BF69 v5 restored sha256=$(sha256sum bf69-data/blob | cut -d' ' -f1) hit=${{ steps.c.outputs.cache-hit }} matched=${{ steps.c.outputs.cache-matched-key }}"
          elif [ "$SEED" = 1 ]; then mkdir -p bf69-data && head -c $((MIB * 1048576)) /dev/urandom >bf69-data/blob
            echo "BF69 v5 made sha256=$(sha256sum bf69-data/blob | cut -d' ' -f1)"
          else echo "BF69 v5 miss"; fi
