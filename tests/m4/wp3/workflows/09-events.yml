name: Events
on:
  push:
    branches: main
    tags: ['v*', '!v0*']
  pull_request:
    types: [opened, synchronize, enqueued, dequeued]
    branches-ignore: [wip/**]
    paths: ['src/**', '!src/gen/**']
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      level:
        description: Level
        required: true
        default: warning
        type: choice
        options: [info, warning]
      dry:
        type: boolean
        default: false
  merge_group:
    types: [checks_requested]
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  a:
    runs-on: ${{ inputs.level }}
    outputs:
      o: ${{ steps.s.outputs.v }}
    container:
      image: node:20
      env:
        N: 1
    services:
      db:
        image: postgres:16
        ports: ['5432:5432']
    steps:
      - id: s
        run: echo v=1 >> $GITHUB_OUTPUT
        working-directory: sub
        shell: bash
  call:
    needs: [a]
    uses: ./.github/workflows/reuse.yml
    with:
      x: 1
    secrets: inherit
