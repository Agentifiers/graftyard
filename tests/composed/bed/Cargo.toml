[package]
name = "hitbed"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
# The hit as main 6c9610bf served it: the object read whole into the isolate.
whole = []

[lib]
crate-type = ["cdylib"]

[dependencies]
graftyard-git = { path = "../../../crates/git", features = ["worker"] }
worker = "0.8.7"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
