[package]
name = "graftyard-actions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", default-features = false }
graftyard-fold = { path = "../fold" }
graftyard-git = { path = "../git" }
graftyard-raft = { path = "../raft" }
graftyard-types.workspace = true
graftyard-wire = { path = "../wire" }
# Verifies a runner's RS256 or PS256 client assertion; public-key operations only, as graftyard-identity uses it.
rsa = { version = "0.9", default-features = false, features = ["sha2"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
thiserror.workspace = true
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
# R24's test builds App records and installations for `graftyard_git::sequencer::app_targets`.
graftyard-identity = { path = "../identity" }
rand = "0.8"
tiny_http = "0.12"
tungstenite = "0.24"
postcard.workspace = true
