[package]
name = "graftyard-lookup"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The group lookup rule over Durable Object bindings, for every Worker that calls a group: site members (dependency
# reads, id-block leases, bootstrap checks), the git edge, and the release endpoint.
[dependencies]
futures-util = { version = "0.3", default-features = false }
graftyard-raft = { path = "../raft" }
graftyard-release = { path = "../release" }
graftyard-types.workspace = true
serde_json.workspace = true
worker.workspace = true
