[package]
name = "graftyard-site"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Test-only routes, fields, and fault injection (kills, resets, retired members, vote probes, call faults). Only
# test installs build with it: `worker-build --release -- --features test-faults`.
test-faults = []

[dependencies]
arrayvec.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
graftyard-api = { path = "../../crates/api" }
graftyard-fold = { path = "../../crates/fold" }
graftyard-git = { path = "../../crates/git", features = ["worker"] }
graftyard-identity = { path = "../../crates/identity" }
graftyard-lookup = { path = "../../crates/lookup" }
graftyard-raft = { path = "../../crates/raft" }
graftyard-release = { path = "../../crates/release" }
graftyard-types.workspace = true
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
wasm-bindgen-futures = "0.4"
worker.workspace = true
