[package]
name = "graftyard-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `graft-mcp` (`design/AGENT-LAYER.md`, Shape, "graft-mcp"; journey A7; `build/BUILD-PLAN.md`, AM2-WP1): the MCP
# authorization server at `mcp.<host>`. The rules and handlers are plain Rust (`lib.rs`, `flow.rs`), tested natively
# against real members (`tests/a7.rs`); `worker` is the Workers host, which reaches the install only through the `EDGE`
# service binding.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
graftyard-identity = { path = "../../crates/identity" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false }
graftyard-lookup = { path = "../../crates/lookup" }
graftyard-release = { path = "../../crates/release" }
graftyard-types.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto"] }
worker.workspace = true

[dev-dependencies]
futures-executor = "0.3"
graftyard-api = { path = "../../crates/api" }
graftyard-raft = { path = "../../crates/raft" }
graftyard-types.workspace = true
graftyard-wire = { path = "../../crates/wire" }
smallvec.workspace = true
