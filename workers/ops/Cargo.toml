[package]
name = "graftyard-ops"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Test installs only (M5-WP4, BF-39): `OPS_KILL` and `OPS_STEP_MIN_ENTRIES` in `src/exec.rs`. A product build has neither,
# so no variable can kill a run or lower a gate. `node deploy.mjs` builds with it when the executor file sets
# `test_faults`.
test-faults = []
# BM-5's bad `graft-ops` (`src/worker_main.rs`, `mint`): every mint answers 503. A build, not a variable, because a
# `graft-ops` upload keeps the running version's bindings, so only the code can differ between N and N+1.
test-mint-fail = ["test-faults"]

[dependencies]
# Unwraps the installation-token signing key with the `MintWrapKey` wrap key: AES-256-GCM, pure Rust, for wasm32.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Actions secrets (`design/SHARED.md`, "Actions", Secrets and variables): opens and seals libsodium's `crypto_box_seal`
# with each owner's X25519 `SealKey`. No default features, so it builds for wasm32; the Worker supplies randomness.
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "rand_core", "salsa20", "seal"] }
graftyard-identity = { path = "../../crates/identity" }
# `RotateStep` for `rotate_command`, native and wasm32 (M5-WP6).
graftyard-release = { path = "../../crates/release" }
graftyard-types.workspace = true
serde.workspace = true
serde_json.workspace = true
worker.workspace = true
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Crypto", "FormData"] }

# The executor (M5-WP3, `src/exec.rs`): `graftyard_release::ops` decides; the `Release` view and commits go through the
# lookup. Only the Worker build runs it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
graftyard-lookup = { path = "../../crates/lookup" }
sha2.workspace = true
