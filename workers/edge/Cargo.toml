[package]
name = "graftyard-edge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# Test installs only: the `/_bed/` driver routes, BF-16's `FORCE_FORMAT`, BF-12's kills on pushes, and the
# `GRAFTYARD_GENESIS` stand-in for the `Release` view. Product builds leave it off.
test-faults = []

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
graftyard-api = { path = "../../crates/api" }
graftyard-fold = { path = "../../crates/fold" }
graftyard-git = { path = "../../crates/git", features = ["worker"] }
graftyard-identity = { path = "../../crates/identity" }
graftyard-lookup = { path = "../../crates/lookup" }
graftyard-raft = { path = "../../crates/raft" }
graftyard-release = { path = "../../crates/release" }
graftyard-types.workspace = true
graftyard-wire = { path = "../../crates/wire" }
js-sys = "0.3"
postcard.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
smallvec.workspace = true
url = "2"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Crypto", "ReadableStream"] }
worker.workspace = true
