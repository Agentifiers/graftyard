[package]
name = "graftyard-front"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# `graft-front` (`design/DESIGN.md`, Stack, Workers; Shape, `Pointers` and `POINTER_TTL`): the stable Worker in front
# of the edge. It forwards every request over a `fetch()` service binding, with a version override only while its
# cached `Release` view pins the edge.
[lib]
crate-type = ["cdylib"]

[dependencies]
graftyard-lookup = { path = "../../crates/lookup" }
graftyard-release = { path = "../../crates/release" }
graftyard-types.workspace = true
serde_json.workspace = true
worker.workspace = true
